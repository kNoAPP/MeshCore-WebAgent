       (https://github.com/kNoAPP/MeshCore-Desktop) -->
  <style>
    .mesh { fill: #4f8ef7; fill-opacity: 0.35; }
    .route { fill: #4f8ef7; stroke: #4f8ef7; }
    .dest, .name { fill: #e2e8f0; }
    .accent { fill: #4f8ef7; }
  </style>
  <g class="mesh">
    <circle cx="14" cy="14" r="5"/>
    <circle cx="32" cy="14" r="5"/>
    <circle cx="14" cy="32" r="5"/>
    <circle cx="32" cy="50" r="5"/>
    <circle cx="50" cy="50" r="5"/>
  </g>
  <g class="route">
    <path d="M14 50 L32 32 L50 32 L50 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="50" r="7" stroke="none"/>
    <circle cx="32" cy="32" r="7" stroke="none"/>
    <circle cx="50" cy="32" r="7" stroke="none"/>
  </g>
  <circle class="dest" cx="50" cy="14" r="7.5"/>
  <!-- The name, as live text so a rename is a text edit. Matches the in-app
       Wordmark: "Core" takes the accent. -->
  <text class="name" x="76" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Mesh<tspan class="accent">Core</tspan> Desktop</text>
</svg>
