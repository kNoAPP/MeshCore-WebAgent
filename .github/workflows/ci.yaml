name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Format, Lint, Type-check, Spell-check, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Spell-check
        run: npm run spell-check

      - name: Build
        run: npm run build
