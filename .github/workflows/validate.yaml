name: Validate Branch

permissions:
  contents: read

on:
  pull_request:
    branches:
      - develop
  merge_group:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Spellcheck repository
        uses: streetsidesoftware/cspell-action@v9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  validation-outcome:
    needs: [validate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validation Failure
        if: ${{ contains(join(needs.*.result, ','), 'failure') }}
        run: |
          echo "One or more jobs failed."
          exit 1
      - name: Validation Success
        run: echo "All jobs completed successfully."
