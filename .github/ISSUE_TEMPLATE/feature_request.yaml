name: Feature Request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description:
        What problem does this solve? What's currently missing or frustrating?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see added or changed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays fully client-side (no backend required)
        - label: This works within the existing Companion Protocol
        - label:
            This requires changes to the binary protocol layer (`lib/meshcore/`)
