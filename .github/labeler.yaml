protocol:
  - changed-files:
      - any-glob-to-any-file:
          - lib/meshcore/**

ui:
  - changed-files:
      - any-glob-to-any-file:
          - components/**
          - app/**
          - public/**

state:
  - changed-files:
      - any-glob-to-any-file:
          - store/**
          - hooks/**
          - types/**

storage:
  - changed-files:
      - any-glob-to-any-file: lib/storage.ts

config:
  - changed-files:
      - any-glob-to-any-file:
          - next.config.ts
          - tsconfig.json
          - postcss.config.mjs
          - eslint.config.mjs
          - cspell.json
          - .prettierrc
          - .prettierignore
          - .editorconfig
          - .gitattributes
          - .gitignore

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - .github/PULL_REQUEST_TEMPLATE.md
          - .github/ISSUE_TEMPLATE/**
          - .github/copilot-instructions.md
          - AGENTS.md
          - CLAUDE.md
          - .agents/**
          - .claude/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/dependabot.yml
          - .github/labeler.yaml
          - release-please-config.json
          - .release-please-manifest.json

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
